version: '3.9'

services:
  db:
    image: postgres:15
    environment: 
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pdb
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pdb
      POSTGRES_HOST: db
    ports:
      - "5000:5000"


volumes: 
  db_data:
