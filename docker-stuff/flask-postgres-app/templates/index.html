<!doctype html>
<html>
<head>
    <title>Notes App</title>
</head>
<body>
    <h1>Notes</h1>
    <form method="POST">
        <input type="text" name="note" placeholder="Write a note..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for note in notes %}
            <li>{{ note[0] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
